<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Διαθέσιμες Θέσεις Πρακτικής</title>
</head>
<body>
    <h2>📋 Διαθέσιμες Θέσεις Πρακτικής</h2>

    <table border="1">
        <tr>
            <th>Τίτλος</th>
            <th>Περιγραφή</th>
            <th>Τοποθεσία</th>
            <th>Διάρκεια</th>
            <th>Απαιτούμενες Δεξιότητες</th>
            <th>Ενδιαφέροντα</th>
            
        </tr>
        <tr th:each="pos : ${positions}">
            <td th:text="${pos.title}"></td>
            <td th:text="${pos.description}"></td>
            <td th:text="${pos.location}"></td>
            <td th:text="${pos.duration} + ' εβδομάδες'"></td>
            <td th:text="${pos.requiredSkills}"></td>
            <td th:text="${pos.topics_of_interest}"></td>
            <td>
                <a th:href="@{/student/apply-form(positionId=${pos.id})}">
                    <button type="button">📥 Αίτηση</button>
                </a>
            </td>
        </tr>
    </table>

    <br>
    <a th:href="@{/student_dashboard}">🔙 Πίσω στο Dashboard</a>
</body>
</html>
