<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Αιτήσεις Φοιτητών</title>
    <meta charset="UTF-8">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f4f4f4;
        }
        td {
            word-wrap: break-word;
            max-width: 200px;
        }
    </style>
</head>
<body>
<h2>📄 Όλες οι Αιτήσεις Φοιτητών</h2>

<table>
    <tr>
        <th>Θέση</th>
        <th>Φοιτητής</th>
        <th>Αρ. Μητρώου</th>
        <th>Email</th>
        <th>Προτιμώμενη Τοποθεσία</th>
    </tr>
    <th:block th:each="pos : ${positions}">
        <tr th:each="student : ${pos.applicants}">
            <td th:text="${pos.title}"></td>
            <td th:text="${student.username}"></td>
            <td th:text="${student.registrationNumber}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.preferredLocation}"></td>
        </tr>
    </th:block>
</table>

<br>
<a th:href="@{/committee_dashboard}">🔙 Επιστροφή στο Dashboard</a>
</body>
</html>
